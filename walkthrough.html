<!DOCTYPE html><html><head><title>Sky at Brio Walkthrough</title><style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}#main{width:100%;height:75vh;object-fit:contain}#nav{display:flex;overflow-x:auto;padding:10px;background:#222}#nav img{height:90px;margin:0 5px;cursor:pointer;border:2px solid transparent}#nav img.active{border-color:#0af}</style></head><body><h2 style="text-align:center">Sky at Brio — Click to navigate</h2><img id="main" src=""><div id="nav"></div><script>const photos=["img_0.jpg","img_1.jpg","img_2.jpg","img_3.jpg","img_4.jpg","img_5.jpg","img_6.jpg","img_7.jpg","img_8.jpg","img_9.jpg"];const main=document.getElementById("main");const nav=document.getElementById("nav");photos.forEach((p,i)=>{const img=document.createElement("img");img.src="photos/"+p;img.onclick=()=>{main.src=img.src;document.querySelectorAll("#nav img").forEach(x=>x.classList.remove("active"));img.classList.add("active")};nav.appendChild(img);if(i===0){main.src=img.src;img.classList.add("active")}});</script></body></html>
